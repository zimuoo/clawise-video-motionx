name: MotionX CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installer, ZIP, relocation and independent timeline
        run: node --test test/install.test.js test/package.test.js test/state.test.mjs test/branding.test.mjs test/motionx-timeline.test.mjs test/encoder-stream.test.mjs test/distribution.test.mjs
      - run: npm run pack:skill
      - run: npm pack --dry-run
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install local video prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Require Chrome and FFmpeg
        run: node cli/motionx.js doctor
      - run: npm test
